[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-sleuth"
version = "0.1.0"
description = "AI agent for forensic SEC filing research with grounded citations"
requires-python = ">=3.11"
dependencies = [
    # HTTP & networking
    "httpx[http2]>=0.27",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    # Embeddings (local, free)
    "sentence-transformers>=3.0",
    # Vector store
    "chromadb>=0.5",
    # Keyword search
    "rank-bm25>=0.2",
    # Fuzzy matching for citation verification
    "thefuzz[speedup]>=0.22",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    # Data validation
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    # Caching
    "diskcache>=5.6",
    # Environment
    "python-dotenv>=1.0",
    # Rate limiting
    "asyncio-throttle>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
